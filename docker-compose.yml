services:
    web:
        image: tp1-web
        build: .
        ports:
            - '5173:5173'
        volumes:
            - .:/app
            - node_modules:/app/node_modules
        environment:
            - CHOKIDAR_USEPOLLING=true
        command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
    node_modules:
